<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Find, plan, and navigate to legal shooting spots and trails on US public land. Free.">
  <meta name="theme-color" content="#12171D">

  <!-- iPhone: Share > Add to Home Screen runs this like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Public Land">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Public Land</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #12171D; margin: 0; height: 100%; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #B9C3CB; font: 600 18px -apple-system, system-ui, Roboto, sans-serif; gap: 18px; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 0 40px rgba(122,31,43,.6); }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><div>Public Land</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
